[workspace]
members = [
    "mira-core",
    "mira-server",
    "mira-client",
    "mira-crypto",
    "mira-utils"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MiraC2 Team"]
license = "MIT"
repository = "https://github.com/Snownull/MiraC2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"

# Networking
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Crypto
aes = "0.8"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"

# File operations
zip = "0.6"
walkdir = "2.3"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Uuid with serde support
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.13"